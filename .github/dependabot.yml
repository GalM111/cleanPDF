# Monthly pull requests that update dependencies and workflow actions. Each
# ecosystem gets one combined pull request, so there are at most two open
# update branches at a time. Security fixes still arrive as soon as they are
# published (when Dependabot security updates are on in the repo settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-npm:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      all-actions:
        patterns: ['*']
